<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitaLingo · Vita Oyunlar</title>
<meta name="description" content="VitaLingo: ilk harfi verilen Türkçe kelimeyi 5 tahminde bulun. Yeşil doğru yer, sarı yanlış yer; seri yapın, kendi rekorunuzu geçin.">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1120'/%3E%3Crect x='8' y='20' width='14' height='24' rx='3' fill='%2322c55e'/%3E%3Crect x='25' y='20' width='14' height='24' rx='3' fill='%23eab308'/%3E%3Crect x='42' y='20' width='14' height='24' rx='3' fill='%23475569'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/ortak.css">
<link rel="stylesheet" href="css/vitalingo.css">
</head>
<body class="vl-body">
<header class="vl-bar">
  <a class="vl-back" href="index.html" aria-label="Oyunlar menüsüne dön"><span class="bk-long">← Oyunlar Menüsü</span><span class="bk-short">← Menü</span></a>
  <b class="vl-title">VitaLingo</b>
  <div class="vl-tools">
    <button type="button" class="vl-tool" id="vlHint" title="Rastgele bir harf aç (30 puan)" aria-label="İpucu: harf aç, 30 puan" disabled><span aria-hidden="true">💡</span><small>30</small></button>
    <button type="button" class="vl-tool" id="vlPass" title="Pas geç — seri korunur (60 puan)" aria-label="Pas geç, 60 puan, seri korunur" disabled><span aria-hidden="true">⏭</span><small>60</small></button>
    <button type="button" class="vl-tool" id="vlSound" aria-pressed="true" aria-label="Sesi kapat">🔊</button>
  </div>
</header>

<div class="vl-strip">
  <div class="vl-stat" title="Toplam puan"><i aria-hidden="true">★</i><span><small>Puan</small><b id="vlScore">0</b></span></div>
  <div class="vl-stat vl-stat--streak" title="Seri"><i aria-hidden="true">🔥</i><span><small>Seri</small><b id="vlStreak">0</b></span></div>
  <div class="vl-stat" title="En iyi seri"><i aria-hidden="true">🏆</i><span><small>En iyi</small><b id="vlBest">0</b></span></div>
  <div class="vl-stat vl-stat--time" title="Bu kelimedeki süre"><i aria-hidden="true">⏱</i><span><small>Süre</small><b id="vlTimer">—</b></span></div>
  <div class="vl-seg" role="group" aria-label="Harf sayısı">
    <button type="button" data-len="4" aria-pressed="false">4</button><button type="button" data-len="5" aria-pressed="true">5</button><button type="button" data-len="6" aria-pressed="false">6</button>
  </div>
</div>

<main class="vl-main">
  <div class="vl-boardwrap" id="vlBoardWrap">
    <div class="vl-board" id="vlBoard" aria-label="Tahmin ızgarası" role="img"></div>
    <div class="vl-toasts" id="vlToasts" aria-live="polite"></div>
    <div class="vl-pop" id="vlPop" aria-live="polite"></div>
    <div class="vl-confetti" id="vlConfetti" aria-hidden="true"></div>
    <div class="vl-reveal" id="vlReveal" hidden role="status">
      <small>Doğru kelime</small>
      <b class="vl-reveal-word" id="vlRevealWord"></b>
      <span class="vl-reveal-health" id="vlRevealHealth" hidden>🩺 Sağlık terimi</span>
      <p id="vlRevealNote"></p>
      <button type="button" class="vo-btn" id="vlNext">Yeni Kelime ▶ <span class="vl-cd">(<span id="vlCountdown">4</span>)</span></button>
    </div>
  </div>
  <div class="vl-keys" id="vlKeys" aria-label="Türkçe klavye"></div>
</main>

<div class="vl-overlay" id="vlLoading"><div class="vl-card"><div class="vl-spin" aria-hidden="true"></div><p>Sözlük yükleniyor…</p></div></div>
<div class="vl-overlay" id="vlError" hidden><div class="vl-card"><h2>Sözlük yüklenemedi</h2><p>Bağlantınızı kontrol edip yeniden deneyin.</p><button type="button" class="vo-btn" id="vlRetry">↻ Yeniden dene</button></div></div>

<script type="module" src="js/vitalingo.js"></script>
</body>
</html>
